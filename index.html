<script>
'use strict';
/* ===== Konstanten ===== */
const STORAGE_KEY = 'notenapp_v2';
const OLD_KEY = 'schoolGrades';
const APP_VERSION = '2.1';
const YEAR1_SUBJECTS = ['BKOM','BE','BWL','TM','TPH','TKOM','IT','AUT','ME-ET-HH','ME-ET-WI','ME-FT-SJ','ME-FT-MD','SST-MES','SST-PO','SST-ROB','SST-QM','FLA-WP','SST-SHT','TPH-FT-SJ','GND','TAR'];
const GRADE_TYPES = ['Klassenarbeit','Test','Mündlich','GFS / Referat','Praktikum / Projekt','Sonstiges'];
const WEIGHT_CHIPS = [0.5, 1, 1.5, 2, 3];
// Quelltext der App (vor dem ersten Rendern) – wird für "App mit Noten speichern" gebraucht
const TEMPLATE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

const IC = {
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  book:'<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M8 7h7"/></svg>',
  award:'<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg>',
  data:'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  chev:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'
};

/* ===== Hilfsfunktionen ===== */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 2) => (n == null || isNaN(n)) ? '–' : Number(n).toFixed(d).replace('.', ',');
const fmtG = v => Math.abs(v * 10 - Math.round(v * 10)) < 1e-9 ? fmt(v, 1) : fmt(v, 2);
const fmtW = n => String(Math.round(n * 100) / 100).replace('.', ',');
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fmtDate = s => { if (!s) return ''; const p = s.split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : s; };
const parseNum = s => { const n = parseFloat(String(s == null ? '' : s).trim().replace(',', '.')); return isNaN(n) ? null : n; };
const gClass = v => v == null ? 'g0' : v < 2.5 ? 'g1' : v < 3.5 ? 'g2' : v < 4.5 ? 'g3' : 'g4';
const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };

/* ===== Berechnungen ===== */
function avg(grades) {
  let s = 0, w = 0;
  for (const g of grades) { const k = g.weight > 0 ? g.weight : 1; s += g.value * k; w += k; }
  return w > 0 ? s / w : null;
}
// Zeugnisnote: Schnitt < 1,5 → 1; < 2,5 → 2; ... (x,50 wird zur schlechteren Note)
function zeugnisNote(a) {
  if (a == null) return null;
  const r = Math.round(a * 10000) / 10000;
  for (let n = 1; n <= 5; n++) if (r < n + 0.5) return n;
  return 6;
}
// Welche Note (0,1er-Schritte) brauche ich höchstens in der nächsten Note mit Gewicht w,
// damit der Schnitt unter target + 0,5 bleibt?
function needed(grades, target, w) {
  if (target >= 6) return { state: 'safe' };
  let S = 0, W = 0;
  for (const g of grades) { const k = g.weight > 0 ? g.weight : 1; S += g.value * k; W += k; }
  const limit = target + 0.5;
  const B = (limit * (W + w) - S) / w;          // nächste Note muss < B sein
  let x = Math.ceil(B * 10 - 1e-6) / 10 - 0.1;  // größte Note im 0,1-Raster, die < B ist
  x = Math.round(x * 10) / 10;
  if (x >= 6) return { state: 'safe' };
  if (x < 1) return { state: 'impossible' };
  return { state: 'need', value: x };
}
function groupAvg(y, g) {
  let s = 0, w = 0;
  for (const m of g.members) {
    const sub = y.subjects.find(x => x.id === m.subjectId); if (!sub) continue;
    const a = avg(sub.grades); if (a == null) continue;
    s += a * m.weight; w += m.weight;
  }
  return w > 0 ? s / w : null;
}
function zeugnisItems(y) {
  const map = new Map();
  y.groups.forEach(g => g.members.forEach(m => { if (!map.has(m.subjectId)) map.set(m.subjectId, g); }));
  const out = [], done = new Set();
  const pushGroup = g => { done.add(g.id); out.push({ kind: 'group', id: g.id, name: g.name, value: groupAvg(y, g), group: g }); };
  y.subjects.forEach(s => {
    const g = map.get(s.id);
    if (g) { if (!done.has(g.id)) pushGroup(g); }
    else out.push({ kind: 'subject', id: s.id, name: s.name, value: avg(s.grades) });
  });
  y.groups.forEach(g => { if (!done.has(g.id)) pushGroup(g); });
  return out;
}
function overall(y) {
  const v = zeugnisItems(y).filter(i => i.value != null);
  if (!v.length) return null;
  return {
    exact: v.reduce((a, i) => a + i.value, 0) / v.length,
    notes: v.reduce((a, i) => a + zeugnisNote(i.value), 0) / v.length,
    count: v.length
  };
}
function sortedGrades(grades) {
  return grades.map((g, i) => ({ g, i }))
    .sort((a, b) => (a.g.date || '').localeCompare(b.g.date || '') || (a.g.created - b.g.created) || (a.i - b.i))
    .map(x => x.g);
}
const allGrades = y => y.subjects.flatMap(s => s.grades.map(g => ({ s, g })));

/* ===== Daten laden / speichern ===== */
function newYear(name) { return { id: uid(), name, subjects: [], groups: [] }; }
function freshDb() {
  const y = newYear('2. Jahr (2026/27)');
  return { version: 2, savedAt: 0, lastBackup: 0, settings: { name: '' }, activeYearId: y.id, years: [y] };
}
function yearFromOld(arr, name) {
  const y = newYear(name);
  y.subjects = arr.filter(s => s && s.name).map(s => ({
    id: uid(), name: String(s.name),
    grades: (Array.isArray(s.grades) ? s.grades : []).map(g => ({
      id: uid(), value: Number(g.value), desc: String(g.description || g.desc || ''),
      weight: Number(g.weight) > 0 ? Number(g.weight) : 1, type: 'Klassenarbeit', date: '', created: 0
    })).filter(g => g.value >= 1 && g.value <= 6)
  }));
  const find = n => y.subjects.find(s => s.name === n);
  const defs = [
    ['TPH (kombiniert)', [['TPH', 2], ['TPH-FT-SJ', 1]]],
    ['SST-Bereich', [['SST-QM', 1], ['SST-SHT', 1]]],
    ['ME gesamt', [['ME-ET-HH', 1], ['ME-ET-WI', 1], ['ME-FT-SJ', 1], ['ME-FT-MD', 1]]]
  ];
  defs.forEach(([gn, ms]) => {
    const members = ms.map(([n, w]) => { const s = find(n); return s ? { subjectId: s.id, weight: w } : null; }).filter(Boolean);
    if (members.length >= 2) y.groups.push({ id: uid(), name: gn, members });
  });
  return y;
}
function normalize(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.years)) return freshDb();
  const out = {
    version: 2, savedAt: Number(d.savedAt) || 0, lastBackup: Number(d.lastBackup) || 0,
    settings: Object.assign({ name: '' }, d.settings || {}), activeYearId: String(d.activeYearId || ''),
    years: d.years.filter(y => y && typeof y === 'object').map(y => {
      const subjects = (Array.isArray(y.subjects) ? y.subjects : []).filter(s => s && typeof s === 'object').map(s => ({
        id: String(s.id || uid()), name: String(s.name || 'Fach'),
        grades: (Array.isArray(s.grades) ? s.grades : []).filter(g => g && typeof g === 'object').map(g => ({
          id: String(g.id || uid()), value: Number(g.value),
          desc: String(g.desc != null ? g.desc : (g.description || '')),
          weight: Number(g.weight) > 0 ? Number(g.weight) : 1,
          type: String(g.type || 'Klassenarbeit'), date: String(g.date || ''), created: Number(g.created) || 0
        })).filter(g => g.value >= 1 && g.value <= 6)
      }));
      const ids = new Set(subjects.map(s => s.id));
      const groups = (Array.isArray(y.groups) ? y.groups : []).filter(g => g && typeof g === 'object').map(g => ({
        id: String(g.id || uid()), name: String(g.name || 'Zeugnisfach'),
        members: (Array.isArray(g.members) ? g.members : []).map(m => ({ subjectId: String(m.subjectId), weight: Number(m.weight) > 0 ? Number(m.weight) : 1 }))
          .filter(m => ids.has(m.subjectId))
      })).filter(g => g.members.length);

function renderModal() {

const setErr = t => { const e = document.getElementById('f-err'); if (e) e.textContent = t; };

/* ===== Aktionen ===== */
function saveSubject() {
  const m = ui.modal, y = year(), raw = val('f-name');
  if (m.id) {
    const s = y.subjects.find(x => x.id === m.id), n = raw.trim();
    if (!n) return setErr('Bitte einen Namen eingeben.');
    if (y.subjects.some(x => x !== s && x.name.toLowerCase() === n.toLowerCase())) return setErr('Dieses Fach gibt es schon.');
    s.name = n.slice(0, 60); save(); closeModal(); render(); return;
  }
  const names = [...new Set(raw.split(/[,;\n]+/).map(t => t.trim()).filter(Boolean))];
  if (!names.length) return setErr('Bitte mindestens einen Fachnamen eingeben.');
  const existing = new Set(y.subjects.map(x => x.name.toLowerCase()));
  let added = 0;
  names.forEach(n => { if (existing.has(n.toLowerCase())) return; existing.add(n.toLowerCase()); y.subjects.push({ id: uid(), name: n.slice(0, 60), grades: [] }); added++; });
  save(); closeModal(); render();
  toast(added ? (added === 1 ? '1 Fach angelegt' : added + ' Fächer angelegt') : 'Diese Fächer gibt es schon.');
}
function toggleSugg(el) {
  const ta = document.getElementById('f-name');
  const list = ta.value.split(/[,;\n]+/).map(t => t.trim()).filter(Boolean), v = el.dataset.v;
  const i = list.findIndex(x => x.toLowerCase() === v.toLowerCase());
  if (i >= 0) { list.splice(i, 1); el.classList.remove('on'); } else { list.push(v); el.classList.add('on'); }
  ta.value = list.join(', ');
}
function deleteSubject(id) {
  const y = year(), s = y.subjects.find(x => x.id === id); if (!s) return;
  if (!confirm(`Fach „${s.name}“${s.grades.length ? ' mit ' + s.grades.length + ' Noten' : ''} wirklich löschen?`)) return;
  y.subjects = y.subjects.filter(x => x !== s);
  y.groups.forEach(g => { g.members = g.members.filter(m => m.subjectId !== id); });
  y.groups = y.groups.filter(g => g.members.length);
  if (ui.subjectId === id) { ui.subjectId = null; popNav(); }
  save(); render(); toast('Fach gelöscht');
}
function moveSubject(id, dir) {
  const y = year(), i = y.subjects.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= y.subjects.length) return;
  [y.subjects[i], y.subjects[j]] = [y.subjects[j], y.subjects[i]];
  save(); render();
}
function saveGrade() {
  const m = ui.modal, y = year();
  const target = y.subjects.find(x => x.id === val('f-subject'));
  const v = parseNum(val('f-value')), w = parseNum(val('f-weight'));
  if (!target) return setErr('Bitte ein Fach wählen.');
  if (v == null || v < 1 || v > 6) return setErr('Die Note muss zwischen 1,0 und 6,0 liegen.');
  if (w == null || w <= 0 || w > 20) return setErr('Die Gewichtung muss größer als 0 sein (z. B. 0,5 / 1 / 2).');
  const data = { value: Math.round(v * 100) / 100, weight: Math.round(w * 100) / 100, date: val('f-date'), type: val('f-type'), desc: val('f-desc').trim() };
  if (m.gradeId) {
    const old = y.subjects.find(x => x.id === m.subjectId), g = old && old.grades.find(x => x.id === m.gradeId);
    if (!g) return closeModal();
    Object.assign(g, data);
    if (old !== target) { old.grades = old.grades.filter(x => x !== g); target.grades.push(g); }
  } else {
    target.grades.push(Object.assign({ id: uid(), created: Date.now() }, data));
  }
  ui.lastSubjectId = target.id;
  save(); closeModal(); render();
  toast(m.gradeId ? 'Note gespeichert' : `${fmtG(data.value)} in ${target.name} eingetragen`);
}
function deleteGrade() {
  const m = ui.modal, y = year(), s = y.subjects.find(x => x.id === m.subjectId);
  if (!s || !confirm('Diese Note wirklich löschen?')) return;
  s.grades = s.grades.filter(g => g.id !== m.gradeId);
  save(); closeModal(); render(); toast('Note gelöscht');
}
function saveGroup() {
  const m = ui.modal, y = year(), name = val('f-name').trim();
  if (!name) return setErr('Bitte einen Namen eingeben.');
  const members = [];
  document.querySelectorAll('#modal input[type=checkbox][data-sid]').forEach(cb => {
    if (!cb.checked || cb.disabled) return;
    const inp = document.querySelector(`#modal [data-wid="${cb.dataset.sid}"]`);
    members.push({ subjectId: cb.dataset.sid, weight: parseNum(inp ? inp.value : '1') });
  });
  if (members.length < 2) return setErr('Bitte mindestens zwei Teilfächer auswählen.');
  if (members.some(x => x.weight == null || x.weight <= 0)) return setErr('Jede Gewichtung muss größer als 0 sein.');
  if (m.id) { const g = y.groups.find(x => x.id === m.id); g.name = name; g.members = members; }
  else y.groups.push({ id: uid(), name, members });
  save(); closeModal(); render(); toast('Zeugnisfach gespeichert');
}
function deleteGroup() {
  const m = ui.modal, y = year(), g = y.groups.find(x => x.id === m.id);
  if (!g || !confirm(`Zeugnisfach „${g.name}“ auflösen? Die Teilfächer und ihre Noten bleiben erhalten.`)) return;
  y.groups = y.groups.filter(x => x !== g);
  save(); closeModal(); render();
}
function copySubjects(from, to, withGroups) {
  const map = {}, existing = new Map(to.subjects.map(s => [s.name.toLowerCase(), s.id]));
  let added = 0;
  from.subjects.forEach(s => {
    const k = s.name.toLowerCase();
    if (existing.has(k)) { map[s.id] = existing.get(k); return; }
    const id = uid(); to.subjects.push({ id, name: s.name, grades: [] }); existing.set(k, id); map[s.id] = id; added++;
  });
  if (withGroups) {
    const used = new Set(to.groups.flatMap(g => g.members.map(m => m.subjectId)));
    const names = new Set(to.groups.map(g => g.name.toLowerCase()));
    from.groups.forEach(g => {
      if (names.has(g.name.toLowerCase())) return;
      const members = g.members.map(m => ({ subjectId: map[m.subjectId], weight: m.weight })).filter(m => m.subjectId && !used.has(m.subjectId));
      if (members.length >= 2) { members.forEach(m => used.add(m.subjectId)); to.groups.push({ id: uid(), name: g.name, members }); }
    });
  }
  return added;
}
function saveYear() {
  const m = ui.modal, name = val('f-name').trim();
  if (!name) return setErr('Bitte einen Namen eingeben.');
  if (m.id) { db.years.find(x => x.id === m.id).name = name; }
  else {
    const cur = year(), ny = newYear(name);
    const cb = document.getElementById('f-copy');
    if (cb && cb.checked) copySubjects(cur, ny, true);
    db.years.push(ny); db.activeYearId = ny.id; ui.subjectId = null;
  }
  save(); closeModal(); render(); toast(m.id ? 'Schuljahr umbenannt' : 'Schuljahr angelegt und geöffnet');
}
function deleteYear(id) {
  const x = db.years.find(z => z.id === id); if (!x) return;
  if (db.years.length === 1) return toast('Das letzte Schuljahr kann nicht gelöscht werden.');
  const n = x.subjects.reduce((t, s) => t + s.grades.length, 0);
  if (!confirm(`Schuljahr „${x.name}“ mit ${x.subjects.length} Fächern und ${n} Noten wirklich löschen?`)) return;
  db.years = db.years.filter(z => z !== x);
  if (db.activeYearId === id) { db.activeYearId = db.years[db.years.length - 1].id; ui.subjectId = null; }
  save(); render(); toast('Schuljahr gelöscht');
}

/* ===== Backup ===== */
function downloadFile(name, content, mime) {
  const blob = new Blob([content], { type: mime }), url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
}
function buildHtmlWithData() {
  const json = JSON.stringify(db).replace(/</g, '\\u003c');
  return TEMPLATE.replace(/(<script id="notenBackup" type="application\/json">)[\s\S]*?(<\/script>)/, (all, a, b) => a + json + b);
}
function exportHtml() {
  db.lastBackup = Date.now(); save();
  downloadFile('Notenverwaltung_' + todayISO() + '.html', buildHtmlWithData(), 'text/html');
  render(); toast('App mit allen Noten gespeichert');
}
function exportJson() {
  db.lastBackup = Date.now(); save();
  downloadFile('noten-backup_' + todayISO() + '.json', JSON.stringify(db, null, 1), 'application/json');
  render(); toast('Backup-Datei gespeichert');
}
async function shareJson() {
  const content = JSON.stringify(db, null, 1);
  const candidates = [new File([content], 'noten-backup_' + todayISO() + '.json', { type: 'application/json' }), new File([content], 'noten-backup_' + todayISO() + '.txt', { type: 'text/plain' })];
  const file = candidates.find(f => { try { return navigator.canShare({ files: [f] }); } catch (e) { return false; } });
  if (!file) return exportJson();
  try {
    await navigator.share({ files: [file], title: 'Noten-Backup' });
    db.lastBackup = Date.now(); save(); render(); toast('Backup geteilt');
  } catch (e) { if (e && e.name !== 'AbortError') exportJson(); }
}
function parseBackup(text) {
  try { return JSON.parse(text); } catch (e) {}
  const m1 = text.match(/<script id="notenBackup" type="application\/json">([\s\S]*?)<\/script>/);
  if (m1) { try { const d = JSON.parse(m1[1]); if (d) return d; } catch (e) {} }
  const m2 = text.match(/\/\/ NOTEN-BACKUP: (\[.*\])/);
  if (m2) { try { return JSON.parse(m2[1]); } catch (e) {} }
  return null;
}
function importText(text) {
  const data = parseBackup(text);
  if (Array.isArray(data) && data.length) return openModal({ type: 'import-old', data });
  if (data && Array.isArray(data.years)) return openModal({ type: 'import', data: normalize(JSON.parse(JSON.stringify(data))) });
  toast('In dieser Datei wurden keine Notendaten gefunden.');
}
function readFile(f) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsText(f); });
}
function importAdd() {
  const d = ui.modal.data, names = new Set(db.years.map(y => y.name.toLowerCase()));
  d.years.forEach(y => { y.id = uid(); if (names.has(y.name.toLowerCase())) y.name += ' (Import)'; names.add(y.name.toLowerCase()); db.years.push(y); });
  save(); closeModal(); render(); toast(d.years.length + ' Schuljahr(e) hinzugefügt – oben auswählbar');
}
function importReplace() {
  if (!confirm('Wirklich ALLE aktuellen Daten durch das Backup ersetzen?')) return;
  db = normalize(ui.modal.data); ui.subjectId = null;
  save(); closeModal(); render(); toast('Backup wiederhergestellt');
}
function importOld() {
  const name = val('f-name').trim() || '1. Jahr (2025/26)';
  db.years.unshift(yearFromOld(ui.modal.data, name));
  save(); closeModal(); render(); toast(`„${name}“ importiert – oben im Menü auswählbar`);
}

/* ===== Ereignisse ===== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, d = el.dataset;
  if (a === 'overlay') { if (e.target === el) closeModal(); return; }
  if (el.disabled) return;
  const y = year();
  switch (a) {
    case 'close': closeModal(); break;
    case 'nav':
      if (ui.subjectId) { ui.subjectId = null; popNav(); }
      ui.tab = d.tab; render(); window.scrollTo(0, 0); break;
    case 'open-subject': ui.subjectId = d.id; ui.tab = 'subjects'; ui.lastSubjectId = d.id; pushNav(); render(); window.scrollTo(0, 0); break;
    case 'back': ui.subjectId = null; popNav(); render(); break;
    case 'add-subject': openModal({ type: 'subject' }); break;
    case 'edit-subject': openModal({ type: 'subject', id: d.id }); break;
    case 'save-subject': saveSubject(); break;
    case 'sugg': toggleSugg(el); break;
    case 'delete-subject': deleteSubject(d.id); break;
    case 'move-subject': moveSubject(d.id, Number(d.dir)); break;
    case 'add-grade': {
      if (!y.subjects.length) { toast('Lege zuerst ein Fach an.'); openModal({ type: 'subject' }); break; }
      const pick = [d.s, ui.subjectId, ui.lastSubjectId].find(id => id && y.subjects.some(s => s.id === id)) || y.subjects[0].id;
      openModal({ type: 'grade', subjectId: pick }); break;
    }
    case 'edit-grade': openModal({ type: 'grade', subjectId: d.s, gradeId: d.g }); break;
    case 'save-grade': saveGrade(); break;
    case 'delete-grade': deleteGrade(); break;
    case 'wchip':
      document.getElementById('f-weight').value = fmtW(Number(d.v));
      el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); break;
    case 'next-weight': ui.nextWeight = Number(d.v); render(); break;
    case 'add-group': openModal({ type: 'group' }); break;
    case 'edit-group': openModal({ type: 'group', id: d.id }); break;
    case 'save-group': saveGroup(); break;
    case 'delete-group': deleteGroup(); break;
    case 'switch-year': db.activeYearId = d.id; ui.subjectId = null; save(); render(); toast('Schuljahr: ' + year().name); break;
    case 'add-year': openModal({ type: 'year' }); break;
    case 'edit-year': openModal({ type: 'year', id: d.id }); break;
    case 'save-year': saveYear(); break;
    case 'delete-year': deleteYear(d.id); break;
    case 'copy-subjects': openModal({ type: 'copy' }); break;
    case 'do-copy': {
      const src = db.years.find(x => x.id === val('f-src')); if (!src) return closeModal();
      const n = copySubjects(src, y, document.getElementById('f-groups').checked);
      save(); closeModal(); render(); toast(n ? n + ' Fächer übernommen' : 'Keine neuen Fächer – alle schon vorhanden'); break;
    }
    case 'install': installApp(); break;
    case 'export-html': exportHtml(); break;
    case 'export-json': exportJson(); break;
    case 'share-json': shareJson(); break;
    case 'import': document.getElementById('file-import').click(); break;
    case 'import-add': importAdd(); break;
    case 'import-replace': importReplace(); break;
    case 'import-old': importOld(); break;
    case 'reset':
      if (confirm('Wirklich ALLE Schuljahre, Fächer und Noten löschen?') && confirm('Letzte Warnung: Hast du ein Backup? Endgültig löschen?')) {
        db = freshDb(); ui.subjectId = null; ui.tab = 'overview'; save(); render(); toast('Alle Daten gelöscht');
      }
      break;
  }
});
document.addEventListener('change', e => {
  const el = e.target, c = el.dataset ? el.dataset.change : null;
  if (c === 'year') {
    db.activeYearId = el.value;
    if (ui.subjectId) { ui.subjectId = null; popNav(); }
    save(); render(); toast('Schuljahr: ' + year().name);
  } else if (c === 'name') {
    db.settings.name = el.value.trim(); save(); render();
  } else if (el.id === 'file-import') {
    const f = el.files && el.files[0]; el.value = '';
    if (f) readFile(f).then(importText).catch(() => toast('Datei konnte nicht gelesen werden.'));
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'f-weight') {
    const w = parseNum(e.target.value);
    document.querySelectorAll('#modal [data-a="wchip"]').forEach(c => c.classList.toggle('on', Number(c.dataset.v) === w));
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && ui.modal && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') {
    const b = document.querySelector('#modal .btn.pri'); if (b) { e.preventDefault(); b.click(); }
  } else if (e.key === 'Escape' && ui.modal) closeModal();
});
